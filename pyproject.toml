[project]
name = "gamblobot"
version = "0.1.0"
description = "Paper-trading agent loop against Kalshi economics and climate markets"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamblobot"]
